syntax = "proto3";

package ordersystem.benchmark;
option cc_generic_services = true;

message DbBenchmarkRequest
{
    enum Operation
    {
        OPERATION_UNSPECIFIED = 0;
        READ = 1;
        INSERT = 2;
        UPDATE = 3;
        DELETE = 4;
    }

    Operation operation = 1;
    uint64 key = 2;
    uint64 value = 3;
}

message DbBenchmarkResponse
{
    bool success = 1;
    uint64 value = 2;
    string error = 3;
    uint64 database_call_us = 4;
    uint64 db_queue_wait_us = 5;
}

service DbBenchmarkService
{
    rpc Execute(DbBenchmarkRequest) returns (DbBenchmarkResponse);
}
